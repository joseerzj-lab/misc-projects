<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Actualizar OTIF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 :root {
   --bg: #FAFAF9;
   --bgCard: #FFFFFF;
   --bgCardAlt: rgba(0,0,0,0.026);
   --bgHover: rgba(0,0,0,0.042);
   --text: #18181B;
   --textSub: #52525B;
   --textFaint: #A1A1AA;
   --border: rgba(0,0,0,0.09);
   --borderSoft: rgba(0,0,0,0.06);
   --borderFocus: #2563EB;
   --blue: #2563EB;
   --blueHover: #1D4ED8;
   --accentBg: rgba(37,99,235,0.06);
   --red: #DC2626;
   --green: #16A34A;
   --orange: #EA580C;
   --yellow: #CA8A04;
   --purple: #7C3AED;
   --pasteBlue: #EFF6FF;
   --pasteRed: #FEF2F2;
   --pasteGreen: #F0FDF4;
   --pasteOrange: #FFF7ED;
   --pasteGray: #F4F4F5;
   --font-base: 'Plus Jakarta Sans','Helvetica Neue',system-ui,-apple-system,sans-serif;
   --font-mono: 'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
   --r-xs: 2px; --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 10px;
   --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 10px;
   --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
   --shadow-sm: 0 1px 4px rgba(0,0,0,0.05);
   --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
   --shadow-lg: 0 8px 24px rgba(0,0,0,0.07);
   --shadow-xl: 0 16px 40px rgba(0,0,0,0.08);
   --t-fast: 0.12s ease;
   --t-normal: 0.20s ease;
   --t-slow: 0.28s cubic-bezier(0.16,1,0.3,1);
   --transition-fast: 0.12s ease;
   --transition-normal: 0.20s ease;
   --header-h: 44px;
 }
 body {
   font-family: var(--font-base);
   background: var(--bg);
   color: var(--text);
   min-height: 100vh;
   display: flex;
   flex-direction: column;
   overflow-x: hidden;
 }
 /* ── Header ── */
 header {
   height: var(--header-h);
   background: var(--bgCard);
   border-bottom: 1px solid var(--border);
   box-shadow: var(--shadow-xs);
   display: flex;
   align-items: center;
   padding: 0 16px;
   gap: 12px;
   position: sticky;
   top: 0;
   z-index: 100;
 }
 .app-title {
   display: flex;
   align-items: center;
   gap: 8px;
   font-weight: 700;
   font-size: 13px;
   letter-spacing: -0.01em;
   color: var(--text);
 }
 .app-icon {
   width: 28px; height: 28px;
   background: var(--text);
   border-radius: var(--r-sm);
   display: flex; align-items: center; justify-content: center;
   color: #fff;
   font-size: 13px;
 }
 .divider { width: 1px; height: 16px; background: var(--border); }
 .tabs { display: flex; gap: 2px; }
 .tab {
   padding: 7px 13px;
   border-radius: var(--r-sm) var(--r-sm) 0 0;
   border: none;
   border-bottom: 2px solid transparent;
   background: transparent;
   color: var(--textFaint);
   font-family: var(--font-base);
   font-size: 11px;
   font-weight: 500;
   cursor: pointer;
   transition: color var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
   display: flex; align-items: center; gap: 5px;
   margin-bottom: -1px;
 }
 .tab:hover { color: var(--textSub); background: var(--bgHover); }
 .tab.active {
   color: var(--text);
   font-weight: 600;
   border-bottom-color: var(--text);
   background: transparent;
 }
 /* ── Main ── */
 main {
   flex: 1;
   overflow-y: auto;
 }
 .panel { display: none; }
 .panel.active { display: flex; }
 /* ── Carga Panel ── */
 #panel-carga {
   align-items: center;
   justify-content: center;
   padding: 40px 24px;
   min-height: calc(100vh - var(--header-h));
 }
 .card {
   background: var(--bgCard);
   border: 1px solid var(--border);
   border-radius: var(--r-lg);
   overflow: hidden;
 }
 .upload-card {
   max-width: 440px;
   width: 100%;
   padding: 32px;
   text-align: center;
 }
 .upload-icon {
   width: 40px; height: 40px;
   background: var(--bgCardAlt);
   border-radius: var(--r-md);
   display: flex; align-items: center; justify-content: center;
   margin: 0 auto 20px;
   font-size: 20px;
   border: 1px solid var(--border);
   color: var(--textFaint);
 }
 .upload-card h2 { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--text); letter-spacing: -0.01em; }
 .upload-card p { font-size: 12px; color: var(--textFaint); margin-bottom: 24px; line-height: 1.6; }
 .drop-zone {
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   gap: 10px;
   padding: 26px 16px;
   border: 1px dashed var(--border);
   border-radius: var(--r-lg);
   background: var(--bgCardAlt);
   cursor: pointer;
   transition: border-color var(--transition-normal), background var(--transition-normal);
   position: relative;
 }
 .drop-zone:hover { border-color: rgba(37,99,235,0.35); background: var(--accentBg); }
 .drop-zone input[type=file] {
   position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
 }
 .drop-label {
   font-size: 11px;
   font-weight: 600;
   color: var(--textSub);
 }
 /* ── Resultados Panel ── */
 #panel-resultados {
   align-items: center;
   justify-content: center;
   padding: 40px 24px;
   min-height: calc(100vh - var(--header-h));
 }
 .result-card {
   max-width: 380px;
   width: 100%;
   padding: 32px;
   text-align: center;
 }
 .result-icon {
   width: 40px; height: 40px;
   background: var(--pasteGreen);
   border-radius: var(--r-md);
   display: flex; align-items: center; justify-content: center;
   margin: 0 auto 18px;
   font-size: 18px;
   border: 1px solid rgba(22,163,74,0.18);
 }
 .result-card h2 { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--text); letter-spacing: -0.01em; }
 .result-card p { font-size: 12px; color: var(--textFaint); margin-bottom: 24px; line-height: 1.6; }
 /* ── Buttons ── */
 .btn {
   display: inline-flex;
   align-items: center;
   justify-content: center;
   gap: 5px;
   padding: 5px 12px;
   border-radius: var(--r-md);
   border: 1px solid transparent;
   font-family: var(--font-base);
   font-weight: 500;
   font-size: 11px;
   line-height: 1;
   cursor: pointer;
   white-space: nowrap;
   user-select: none;
   transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform 0.10s ease;
   width: 100%;
 }
 .btn:hover:not(:disabled) { transform: translateY(-1px); }
 .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
 .btn:disabled { opacity: 0.32; cursor: not-allowed; }
 .btn:focus-visible { outline: 2px solid var(--borderFocus); outline-offset: 2px; }
 .btn-primary { background: #18181B; color: #FFFFFF; border-color: rgba(0,0,0,0.06); }
 .btn-primary:hover:not(:disabled) { background: #27272A; }
 .btn-secondary { background: var(--bgCardAlt); color: var(--text); border-color: var(--border); }
 .btn-secondary:hover:not(:disabled) { background: var(--bgHover); }
 .btn-danger { background: var(--pasteRed); color: var(--red); border-color: rgba(220,38,38,0.18); }
 .btn-danger:hover:not(:disabled) { background: rgba(220,38,38,0.12); }
 .btn-green { background: var(--pasteGreen); color: var(--green); border-color: rgba(22,163,74,0.18); }
 .btn-green:hover:not(:disabled) { background: rgba(22,163,74,0.12); }
 .btn-lg { padding: 8px 16px; font-size: 12px; font-weight: 600; }
 /* ── Toast ── */
 #toast {
   position: fixed;
   bottom: 20px;
   left: 50%;
   transform: translateX(-50%) translateY(80px);
   background: #18181B;
   color: #F4F4F5;
   border: 1px solid rgba(255,255,255,0.08);
   padding: 8px 16px;
   border-radius: var(--r-md);
   font-size: 11px;
   font-weight: 600;
   letter-spacing: 0.01em;
   box-shadow: var(--shadow-lg);
   z-index: 2000;
   white-space: nowrap;
   pointer-events: none;
   transition: transform var(--t-slow);
 }
 #toast.show { transform: translateX(-50%) translateY(0); }
 #toast.toast-ok { background: #14532D; }
 #toast.toast-error { background: #7F1D1D; }
 /* ── Spinner ── */
 .spinner {
   width: 14px; height: 14px;
   border: 2px solid var(--borderSoft);
   border-top-color: var(--text);
   border-radius: 50%;
   animation: spin 0.65s linear infinite;
   display: none;
 }
 .spinner.active { display: block; }
 @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
<div class="app-title">
<div class="app-icon">📊</div>
   ACTUALIZAR OTIF
</div>
<div class="divider"></div>
<nav class="tabs">
<button class="tab active" id="tab-carga" onclick="switchTab('carga')">📥 Cargar Datos</button>
<button class="tab" id="tab-resultados" onclick="switchTab('resultados')">📊 OTIF Proyectado</button>
</nav>
</header>
<main>
<!-- Panel Carga -->
<div class="panel active" id="panel-carga">
<div class="card upload-card">
<div class="upload-icon">📥</div>
<h2>Cargar Reporte OTIF</h2>
<p>Sube tu archivo CSV para procesar los datos de ParentOrder y LPN.</p>
<label class="drop-zone" id="drop-zone">
<div class="spinner" id="spinner"></div>
<span class="drop-label" id="drop-label">Seleccionar archivo CSV</span>
<input type="file" accept=".csv,.xlsx,.xls" id="file-input" onchange="handleFile(event)" />
</label>
</div>
</div>
<!-- Panel Resultados -->
<div class="panel" id="panel-resultados">
<div class="card result-card">
<div class="result-icon">📋</div>
<h2>¡Datos Procesados!</h2>
<p id="result-desc">Se han calculado las métricas OTIF.</p>
<button class="btn btn-primary" id="copy-btn" onclick="copyTable()" disabled>
       📋 Copiar Tabla Completa
</button>
</div>
</div>
</main>
<div id="toast"></div>
<script>
 // ── State ──
 let pivot = {};
 let estados = [];
 let sortedParentOrders = [];
 // ── Tab switching ──
 function switchTab(name) {
   document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
   document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
   document.getElementById('panel-' + name).classList.add('active');
   document.getElementById('tab-' + name).classList.add('active');
 }
 // ── Toast ──
 function flash(msg) {
   const el = document.getElementById('toast');
   el.textContent = msg;
   el.classList.add('show');
   setTimeout(() => el.classList.remove('show'), 2500);
 }
 // ── File handler ──
 function handleFile(e) {
   const file = e.target.files[0];
   if (!file) return;
   setLoading(true, file.name);
   const reader = new FileReader();
   reader.onload = (ev) => {
     try {
       const bstr = ev.target.result;
       const wb = XLSX.read(bstr, { type: 'binary' });
       const wsname = wb.SheetNames[0];
       const ws = wb.Sheets[wsname];
       const jsonData = XLSX.utils.sheet_to_json(ws, { defval: '' });
       const filtered = jsonData.filter(row => {
         const commerce = String(row['Commerce'] || '').trim().toLowerCase();
         return commerce.startsWith('i');
       });
       if (filtered.length === 0) {
         flash('⚠️ No se encontraron registros');
         setLoading(false);
         return;
       }
       const pivotObj = {};
       const estadosSet = new Set();
       filtered.forEach(row => {
         const parentOrder = String(row['ParentOrder'] || '').trim();
         const estado = String(row['Estado'] || '').trim();
         const lpn = String(row['LPN'] || '').trim();
         if (!parentOrder || !estado) return;
         estadosSet.add(estado);
         if (!pivotObj[parentOrder]) pivotObj[parentOrder] = {};
         if (!pivotObj[parentOrder][estado]) pivotObj[parentOrder][estado] = 0;
         if (lpn !== '') pivotObj[parentOrder][estado]++;
       });
       estadosSet.add('Planificado En Simpliroute');
       pivot = pivotObj;
       estados = Array.from(estadosSet).sort();
       sortedParentOrders = Object.keys(pivot).sort();
       document.getElementById('result-desc').textContent =
         `Se han calculado las métricas OTIF para ${sortedParentOrders.length} ParentOrders — ${filtered.length} filas procesadas.`;
       document.getElementById('copy-btn').disabled = sortedParentOrders.length === 0;
       flash(`✓ ${filtered.length} filas procesadas correctamente`);
       setLoading(false);
       switchTab('resultados');
     } catch (err) {
       flash('❌ Error al procesar el archivo');
       setLoading(false);
     }
   };
   reader.readAsBinaryString(file);
   e.target.value = '';
 }
 function setLoading(on, name) {
   document.getElementById('spinner').classList.toggle('active', on);
   document.getElementById('drop-label').textContent = on ? 'Procesando...' : (name || 'Seleccionar archivo CSV');
   document.getElementById('file-input').disabled = on;
 }
 // ── Copy table ──
 function copyTable() {
   const tempTable = document.createElement('table');
   tempTable.style.borderCollapse = 'collapse';
   tempTable.style.fontFamily = 'Aptos, sans-serif';
   const thStyle = "border:1px solid black;font-weight:bold;font-family:Aptos,sans-serif;font-size:12pt;padding:4px;text-align:center;color:black;background-color:transparent;";
   const tdStyle = "border:1px solid black;font-family:Aptos,sans-serif;font-size:11pt;padding:4px;text-align:center;color:black;background-color:transparent;";
   const tdStyleLeft = "border:1px solid black;font-family:Aptos,sans-serif;font-size:11pt;padding:4px;text-align:left;color:black;background-color:transparent;";
   // Header
   const thead = document.createElement('thead');
   const trHead = document.createElement('tr');
   trHead.innerHTML = `<th style="${thStyle}">ParentOrder</th>` +
     estados.map(e => `<th style="${thStyle}">${e}</th>`).join('') +
     `<th style="${thStyle}">Total general</th>`;
   thead.appendChild(trHead);
   tempTable.appendChild(thead);
   // Body
   const tbody = document.createElement('tbody');
   sortedParentOrders.forEach(po => {
     const tr = document.createElement('tr');
     let totalFila = 0;
     const tds = estados.map(est => {
       const count = (pivot[po] && pivot[po][est]) ? pivot[po][est] : 0;
       totalFila += count;
       return `<td style="${tdStyle}">${count}</td>`;
     }).join('');
     tr.innerHTML = `<td style="${tdStyleLeft}">${po}</td>` + tds + `<td style="${tdStyle}">${totalFila}</td>`;
     tbody.appendChild(tr);
   });
   tempTable.appendChild(tbody);
   const container = document.createElement('div');
   container.style.position = 'absolute';
   container.style.left = '-9999px';
   container.appendChild(tempTable);
   document.body.appendChild(container);
   const range = document.createRange();
   range.selectNode(tempTable);
   window.getSelection().removeAllRanges();
   window.getSelection().addRange(range);
   try {
     document.execCommand('copy');
     flash('📋 Tabla copiada correctamente');
   } catch (err) {
     flash('❌ Error al copiar');
   }
   window.getSelection().removeAllRanges();
   document.body.removeChild(container);
 }
</script>
</body>
</html>
