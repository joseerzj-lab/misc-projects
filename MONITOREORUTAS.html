            </button>
            <button onClick={()=>setHiddenKeys(new Set(data.map(d=>d.patente)))}
              style={{padding:'2px 8px',borderRadius:99,fontSize:9,fontWeight:700,border:'1px solid rgba(220,38,38,0.4)',background:'rgba(220,38,38,0.06)',color:'#dc2626',cursor:'pointer',fontFamily:'inherit'}}>
              Ocultar todo
            </button>
            <span style={{fontSize:9,color:'#a1a1aa'}}>{data.length - hiddenKeys.size} de {data.length} visibles</span>
            <div style={{marginLeft:'auto'}}>
              <input value={panelSearch} onChange={e=>setPanelSearch(e.target.value)}
                placeholder="Buscar…" style={{padding:'2px 8px',borderRadius:4,border:'1px solid rgba(0,0,0,0.1)',fontSize:9,fontFamily:'inherit',outline:'none',width:120}}/>
            </div>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4,maxHeight:90,overflowY:'auto'}}>
            {data.filter(d => !panelSearch || d.patente.toLowerCase().includes(panelSearch.toLowerCase())).map(d => {
              const hidden = hiddenKeys.has(d.patente);
              const hasNote = !!(notes[d.patente] || (d.altName && notes[d.altName]));
              return (
                <button key={d.patente} onClick={()=>toggle(d.patente)}
                  style={{padding:'2px 8px',borderRadius:99,fontSize:9,fontWeight:700,cursor:'pointer',fontFamily:'inherit',
                          border:`1px solid ${hidden?'rgba(0,0,0,0.1)':hasNote?'rgba(124,58,237,0.4)':'rgba(37,99,235,0.35)'}`,
                          background:hidden?'rgba(0,0,0,0.04)':hasNote?'rgba(124,58,237,0.07)':'rgba(37,99,235,0.07)',
                          color:hidden?'#a1a1aa':hasNote?'#7c3aed':'#2563eb',
                          opacity:hidden?0.5:1,textDecoration:hidden?'line-through':'none'}}>
                  {d.patente}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {showSettings && (
        <div style={{padding:'12px 14px',borderRadius:8,border:'1px solid rgba(124,58,237,0.2)',background:'rgba(250,248,255,0.98)',display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:10,fontWeight:900,textTransform:'uppercase',letterSpacing:'0.08em',color:'#7c3aed'}}>Configuración</span>
            <button onClick={()=>setShowSettings(false)} style={{background:'none',border:'none',cursor:'pointer',color:'#a1a1aa',lineHeight:1}}><XIcon size={14}/></button>
          </div>
          <div style={{display:'flex',gap:14,flexWrap:'wrap',alignItems:'flex-start'}}>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <span style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'#a1a1aa'}}>Tamaño barras</span>
              <div style={{display:'flex',gap:3}}>
                {[['XS',16],['S',24],['M',32],['L',48],['XL',64]].map(([lbl,sz])=>(
                  <button key={sz} onClick={()=>setBarSize(sz)}
                    style={{padding:'2px 8px',borderRadius:4,fontSize:9,fontWeight:700,border:'none',cursor:'pointer',fontFamily:'inherit',
                            background:barSize===sz?'#7c3aed':'rgba(0,0,0,0.05)',
                            color:barSize===sz?'#fff':'#a1a1aa'}}>{lbl}</button>
                ))}
              </div>
            </div>
            {[['Mostrar % completado', showLabels, setShowLabels],
              ['Mostrar leyenda', showLegend, setShowLegend],
              ['Mostrar grilla', showGrid, setShowGrid]].map(([lbl,val,setter])=>(
              <div key={lbl} style={{display:'flex',flexDirection:'column',gap:4}}>
                <span style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'#a1a1aa'}}>{lbl}</span>
                <button onClick={()=>setter(p=>!p)}
                  style={{padding:'2px 8px',borderRadius:4,fontSize:9,fontWeight:700,border:'none',cursor:'pointer',fontFamily:'inherit',
                          background:val?'#7c3aed':'rgba(0,0,0,0.05)',color:val?'#fff':'#a1a1aa'}}>{val?'ON':'OFF'}</button>
              </div>
            ))}
          </div>
          <div style={{borderTop:'1px solid rgba(124,58,237,0.15)',paddingTop:8,display:'flex',flexDirection:'column',gap:6}}>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'#a1a1aa'}}>
                Notas por vehículo
              </span>
              <button onClick={()=>setShowNotesPaste(p=>!p)}
                style={{padding:'2px 8px',borderRadius:4,fontSize:9,fontWeight:700,border:'1px solid rgba(124,58,237,0.3)',background:'rgba(124,58,237,0.07)',color:'#7c3aed',cursor:'pointer',fontFamily:'inherit'}}>
                Pegar tabla
              </button>
            </div>
            {showNotesPaste && (
              <div style={{display:'flex',gap:6}}>
                <textarea value={notesPasteRaw} onChange={e=>setNotesPasteRaw(e.target.value)}
                  placeholder={'VPV01\tJuan Pérez\nVPV02\tPedro Rojas'}
                  style={{flex:1,height:60,padding:6,borderRadius:4,border:'1px solid rgba(124,58,237,0.25)',fontSize:9,fontFamily:'monospace',outline:'none',resize:'none'}}/>
                <button onClick={applyNotesPaste}
                  style={{padding:'4px 12px',borderRadius:4,border:'1px solid rgba(124,58,237,0.4)',background:'rgba(124,58,237,0.1)',color:'#7c3aed',fontSize:9,fontWeight:700,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                  Aplicar
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      <div ref={chartRef} style={{background:'#fff',borderRadius:10,border:'1px solid rgba(0,0,0,0.08)',padding:'12px 16px'}}>
        <div style={{textAlign:'center',marginBottom:8,fontSize:15,fontWeight:800,color:'#18181b',letterSpacing:'-0.02em'}}>
          Estado de Vehículos / Patentes — {visible.length} mostrados
        </div>
        <div style={{width:'100%',height:chartH,overflow:layout==='horizontal'?'visible':'auto'}}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart
              data={visible}
              layout={layout === 'horizontal' ? 'vertical' : 'horizontal'}
              margin={layout === 'horizontal'
                ? {top:10, right:80, left:100, bottom:20}
                : {top:35, right:20, left:20, bottom:60}}
              barCategoryGap="20%">
              {showGrid && <CartesianGrid strokeDasharray="3 3" opacity={0.1}
                horizontal={layout==='vertical'} vertical={layout==='horizontal'}/>}
              {layout === 'vertical'
                ? <>
                    <XAxis dataKey="patente" interval={0}
                      height={Object.values(notes).some(v=>v)?100:80}
                      tick={<ChartTickV notes={notes}/>}
                      label={{value:'Patentes / Vehículos',position:'bottom',offset:0,fill:'#636c76',fontSize:10}}/>
                    <YAxis tick={{fontSize:10,fill:'#636c76'}}
                      label={{value:'Cantidad de ISOs',angle:-90,position:'insideLeft',offset:10,fill:'#636c76',fontSize:10,style:{textAnchor:'middle'}}}/>
                  </>
                : <>
                    <XAxis type="number" tick={{fontSize:10,fill:'#636c76'}}
                      label={{value:'Cantidad de ISOs',position:'bottom',offset:-5,fill:'#636c76',fontSize:10}}/>
                    <YAxis dataKey="patente" type="category"
                      width={Object.values(notes).some(v=>v)?105:90}
                      tick={<ChartTickH notes={notes}/>}
                      label={{value:'Patentes / Vehículos',angle:-90,position:'insideLeft',offset:10,fill:'#636c76',fontSize:10,style:{textAnchor:'middle'}}}/>
                  </>
              }
              <RTooltip
                cursor={{fill:'rgba(0,0,0,0.03)'}}
                contentStyle={{backgroundColor:'#ffffff',borderColor:'rgba(0,0,0,0.09)',borderRadius:8,boxShadow:'0 4px 20px rgba(0,0,0,0.1)',fontSize:12,fontWeight:700}}
                formatter={(value,name)=>name==='dummy'?null:[value,name]}
                labelFormatter={label=>{const d=visible.find(x=>x.patente===label);const n=notes[label];const base=d?.altName?`${label} (${d.altName})`:label;return n?`${base} — ${n}`:base;}}/>
              {showLegend && <Legend align="center" verticalAlign="bottom" wrapperStyle={{paddingTop:16,fontSize:11}}/>}
              <Bar dataKey="Terminado" stackId="s" fill="#22c55e" radius={[0,0,0,0]} barSize={barSize}/>
              <Bar dataKey="En Ruta"   stackId="s" fill="#ef4444" radius={[0,0,0,0]} barSize={barSize}/>
              <Bar dataKey="Pendiente" stackId="s" fill="#eab308" radius={[4,4,0,0]} barSize={barSize}/>
              <Bar dataKey="dummy" stackId="s" fill="transparent" isAnimationActive={false} barSize={barSize}>
                {showLabels && <LabelList dataKey="avance"
                  position={layout==='horizontal'?'right':'top'}
                  offset={8}
                  formatter={fmt}
                  style={{fill:'#1f2328',fontSize:11,fontWeight:900,textAnchor:'middle'}}/>}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
};
})();
if(typeof renderGrafico==='function') renderGrafico();
</script>
</body>
</html>
