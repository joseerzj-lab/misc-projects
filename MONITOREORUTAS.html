<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoreo de Rutas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.1.16/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>
<style>
:root{
  --bg:#FAFAF9;--bgCard:#FFFFFF;--bgCardAlt:rgba(0,0,0,0.026);--bgHover:rgba(0,0,0,0.042);
  --text:#18181B;--textSub:#52525B;--textFaint:#A1A1AA;
  --border:rgba(0,0,0,0.09);--borderSoft:rgba(0,0,0,0.06);--borderFocus:#2563EB;
  --blue:#2563EB;--blueHover:#1D4ED8;--accentBg:rgba(37,99,235,0.06);
  --red:#DC2626;--green:#16A34A;--orange:#EA580C;--yellow:#CA8A04;--purple:#7C3AED;
  --pasteBlue:#EFF6FF;--pasteRed:#FEF2F2;--pasteGreen:#F0FDF4;--pasteOrange:#FFF7ED;
  --pasteGray:#F4F4F5;--pastePurple:#F5F3FF;
  --font-base:'Plus Jakarta Sans','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --font-mono:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --r-xs:2px;--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:10px;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.05);
  --shadow-md:0 2px 8px rgba(0,0,0,0.06);--shadow-lg:0 8px 24px rgba(0,0,0,0.07);
  --t-fast:0.12s ease;--t-normal:0.20s ease;--t-slow:0.28s cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-base);font-size:12px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body.app-layout{display:flex;flex-direction:column;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.14);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.26)}
h1{font-size:17px;font-weight:700;letter-spacing:-0.01em}
h2{font-size:14px;font-weight:700;letter-spacing:-0.01em}
h3{font-size:12px;font-weight:600}
.section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--textFaint)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.text-xs{font-size:10px;color:var(--textFaint)}
.text-sm{font-size:11px;color:var(--textSub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 12px;border:1px solid transparent;border-radius:var(--r-md);font-family:var(--font-base);font-size:11px;font-weight:500;line-height:1;cursor:pointer;outline:none;white-space:nowrap;user-select:none;transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast),transform 0.10s ease}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(0.98)}
.btn:disabled{opacity:0.32;cursor:not-allowed}
.btn-primary{background:#18181B;color:#fff;border-color:rgba(0,0,0,0.06)}
.btn-primary:hover:not(:disabled){background:#27272A}
.btn-secondary{background:var(--bgCardAlt);color:var(--text);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--bgHover)}
.btn-danger{background:var(--pasteRed);color:var(--red);border-color:rgba(220,38,38,0.18)}
.btn-danger:hover:not(:disabled){background:rgba(220,38,38,0.12)}
.btn-sm{padding:3px 8px;font-size:10px}
.btn-block{width:100%;padding:9px;font-size:12px;font-weight:600;background:#18181B;color:#fff;border-radius:var(--r-md);border:1px solid rgba(0,0,0,0.08);cursor:pointer}
.btn-block:hover:not(:disabled){background:#27272A}
.btn-block:disabled{opacity:0.32;cursor:not-allowed}
.header{background:var(--bgCard);border-bottom:1px solid var(--border);box-shadow:var(--shadow-xs);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;border-bottom:1px solid var(--borderSoft);gap:12px}
.header-brand{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-0.01em;white-space:nowrap}
.tabs-container{display:flex;padding:0 8px;overflow-x:auto}
.tabs-wrapper{display:flex;align-items:flex-end;min-width:max-content}
.tab-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-bottom:2px solid transparent;border-radius:var(--r-sm) var(--r-sm) 0 0;background:transparent;color:var(--textFaint);font-family:var(--font-base);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-1px;transition:color var(--t-fast),background var(--t-fast),border-color var(--t-fast)}
.tab-btn:hover{color:var(--textSub);background:var(--bgHover)}
.tab-btn.active{color:var(--text);font-weight:600;border-bottom-color:var(--text);background:transparent}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;padding:0 4px;border-radius:3px;font-size:9px;font-weight:700;font-family:var(--font-mono);background:var(--pasteGray);color:var(--textSub);border:1px solid var(--border)}
.main-content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.tab-pane{display:none;width:100%;overflow-y:auto}
.tab-pane.active{display:flex;flex-direction:column;flex:1}
.main-padded{flex:1;padding:20px;overflow-y:auto}
.container{width:100%;max-width:900px;margin:0 auto}
.container-lg{width:100%;max-width:1200px;margin:0 auto}
.card{background:var(--bgCard);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px}
.card-header{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--borderSoft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.param-section{background:var(--bgCard);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:10px}
.param-section-header{padding:10px 14px;border-bottom:1px solid var(--borderSoft);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bgCardAlt)}
.param-section-body{padding:14px}
.input{width:100%;padding:6px 10px;background:var(--bgCard);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-family:var(--font-base);font-size:11px;line-height:1.4;outline:none;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.input:focus{border-color:var(--borderFocus);box-shadow:0 0 0 2.5px rgba(37,99,235,0.10)}
.input::placeholder{color:var(--textFaint)}
.upload-zone{border:1px dashed var(--border);border-radius:var(--r-lg);padding:18px 16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bgCardAlt);transition:background var(--t-normal),border-color var(--t-normal)}
.upload-zone:hover,.upload-zone.drag{background:var(--accentBg);border-color:rgba(37,99,235,0.35)}
.upload-zone.loaded{border-style:solid;border-color:rgba(22,163,74,0.30);background:var(--pasteGreen)}
.upload-filename{font-size:11px;font-weight:600;color:var(--textSub);word-break:break-all;max-width:260px}
.stat-chip{display:inline-flex;align-items:baseline;gap:4px;padding:2px 8px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--bgCard)}
.stat-chip-val{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text)}
.stat-chip-val.blue{color:var(--blue)}.stat-chip-val.green{color:var(--green)}
.stat-chip-val.red{color:var(--red)}.stat-chip-val.orange{color:var(--orange)}
.stat-chip-lbl{font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint)}
.pill{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:var(--r-xs);font-family:var(--font-mono);font-size:10px;font-weight:600;border:1px solid;white-space:nowrap;letter-spacing:0.02em}
.pill-gray{background:var(--pasteGray);color:var(--textSub);border-color:var(--border)}
.pill-blue{background:var(--pasteBlue);color:var(--blue);border-color:rgba(37,99,235,0.20)}
.pill-green{background:var(--pasteGreen);color:var(--green);border-color:rgba(22,163,74,0.20)}
.pill-red{background:var(--pasteRed);color:var(--red);border-color:rgba(220,38,38,0.20)}
.pill-purple{background:var(--pastePurple);color:var(--purple);border-color:rgba(124,58,237,0.20)}
.stats-bar{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid var(--borderSoft);gap:5px;flex-wrap:wrap;background:var(--bgCardAlt);flex-shrink:0}
.progress-bar{width:100%;height:3px;background:var(--borderSoft);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--text);border-radius:2px;transition:width 0.3s ease}
.progress-bar-fill.green{background:var(--green)}
.dash-table{border-collapse:separate;border-spacing:0;width:100%;font-size:11px}
.dash-table thead th{background:#FAFAFA;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.dash-table tbody td{border-bottom:1px solid var(--borderSoft)}
.dash-table tbody tr:hover{background:rgba(0,0,0,0.016)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:200px;gap:10px;padding:40px;text-align:center}
.empty-title{font-size:13px;font-weight:600;color:var(--textSub)}
.empty-body{font-size:11px;color:var(--textFaint);max-width:280px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#18181B;color:#F4F4F5;border:1px solid rgba(255,255,255,0.08);padding:8px 16px;border-radius:var(--r-md);font-size:11px;font-weight:600;letter-spacing:0.01em;box-shadow:var(--shadow-lg);z-index:2000;white-space:nowrap;pointer-events:none;transition:transform var(--t-slow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.toast-ok{background:#14532D}.toast.toast-error{background:#7F1D1D}.toast.toast-warn{background:#78350F}
/* Map */
.map-layout{display:grid;grid-template-columns:320px 1fr;height:100%;overflow:hidden}
@media (max-width:900px){.map-layout{grid-template-columns:1fr}}
.map-sidebar{border-right:1px solid var(--border);overflow-y:auto;background:var(--bgCard);display:flex;flex-direction:column}
.map-container{position:relative;background:#eef0f2;display:flex;flex-direction:column;overflow:hidden}
.map-toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bgCard);flex-wrap:wrap;flex-shrink:0;z-index:500}
#leafmap{flex:1;position:relative}
.veh-row-wrap{display:flex;align-items:stretch;border-bottom:1px solid var(--borderSoft)}
.veh-row{flex:1;display:flex;flex-direction:column;gap:6px;padding:10px 14px;border:none;background:transparent;cursor:pointer;text-align:left;transition:background var(--t-fast);min-width:0}
.veh-row:hover{background:var(--bgHover)}
.veh-row.selected{background:var(--accentBg)}
.veh-row.veh-hidden{opacity:0.4}
.veh-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.veh-eye{flex-shrink:0;width:32px;border:none;border-left:1px solid var(--borderSoft);background:transparent;cursor:pointer;color:var(--textFaint);font-size:14px;display:flex;align-items:center;justify-content:center;transition:color var(--t-fast),background var(--t-fast);padding:0}
.veh-eye:hover{background:rgba(220,38,38,0.07);color:var(--red)}
.veh-eye.is-hidden{color:var(--red);background:rgba(220,38,38,0.06)}
.veh-eye.is-hidden:hover{background:rgba(22,163,74,0.07);color:var(--green)}
.veh-name{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text)}
.veh-pat{font-family:var(--font-mono);font-size:10px;color:var(--textFaint)}
.est-toggle{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--border);border-radius:var(--r-xs);font-size:10px;font-weight:600;color:var(--textFaint);cursor:pointer;user-select:none;background:var(--bgCard);transition:all var(--t-fast)}
.est-toggle.on{color:var(--text);border-color:rgba(0,0,0,0.18)}
.est-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.leaflet-popup-content{font-family:var(--font-base);font-size:11px;margin:10px 12px}
.rebaja-card{border:1px solid rgba(220,38,38,0.20);background:var(--pasteRed);border-radius:var(--r-md);padding:10px 12px}
.rebaja-photo{max-width:100%;border-radius:var(--r-sm);margin-top:6px;border:1px solid var(--border)}
/* Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kpi-card{background:var(--bgCard);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.kpi-val{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);line-height:1;margin-bottom:4px}
.kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--textFaint)}
.bar-chart{display:flex;flex-direction:column}
.bar-row{display:grid;grid-template-columns:160px 1fr 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--borderSoft)}
.bar-row:last-child{border-bottom:none}
.bar-label{display:flex;flex-direction:column;gap:1px;min-width:0}
.bar-track{display:flex;height:9px;background:var(--borderSoft);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;transition:width 0.3s}
.bar-val{font-family:var(--font-mono);font-size:11px;font-weight:700;text-align:right}
/* Tabla */
.tabla-filters{display:flex;gap:8px;align-items:center;padding-bottom:10px;flex-wrap:wrap;margin-bottom:10px}
/* ISOs accordion */
.accord-hdr{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:none;background:transparent;cursor:pointer;text-align:left;border-radius:var(--r-lg)}
.accord-hdr:hover{background:var(--bgHover)}
.accord-body{padding:6px 8px;border-top:1px solid var(--borderSoft);display:flex;flex-direction:column;gap:1px}
.iso-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--r-sm)}
.iso-row:hover{background:var(--bgHover)}
/* Incidencias */
.inc-group{display:flex;flex-direction:column}
.inc-row{padding:10px 0;border-bottom:1px solid var(--borderSoft)}
.inc-row:last-child{border-bottom:none}
.inc-photo{max-width:200px;border-radius:var(--r-sm);margin-top:6px;border:1px solid var(--border);display:block;cursor:pointer}
/* SR Config */
.sr-config{display:grid;grid-template-columns:1fr 160px auto;gap:10px;align-items:end}
@media (max-width:600px){.sr-config{grid-template-columns:1fr}}
/* Image modal */
#imgModal{position:fixed;inset:0;z-index:2500;align-items:center;justify-content:center;background:rgba(0,0,0,0.85)}
.img-overlay-content{position:relative;z-index:1;padding:8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.img-overlay-close{position:absolute;top:-14px;right:-14px;width:30px;height:30px;border-radius:50%;background:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:2;box-shadow:var(--shadow-md)}
.img-overlay-nav{display:flex;align-items:center;gap:14px}
.img-nav-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.img-nav-btn:hover{background:rgba(255,255,255,0.22)}
.img-nav-count{color:#fff;font-size:12px;font-weight:700;font-family:var(--font-mono)}
/* Photos */
.photo-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.photo-strip .inc-photo,.photo-strip .rebaja-photo{max-width:130px;max-height:130px;object-fit:cover;margin-top:0}
/* Tab help strip */
.tab-help{padding:7px 16px;font-size:11px;line-height:1.4;color:var(--textSub);background:var(--bgCardAlt);border-bottom:1px solid var(--borderSoft)}
.tab-help:empty{display:none}
/* Consultar */
.cq-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.cq-grid{grid-template-columns:1fr}}
.cq-chip{font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--textFaint);cursor:pointer;font-family:var(--font-base)}
.cq-chip.active{color:var(--text);border-color:var(--text);background:var(--bgHover)}
</style>
</head>
<body class="app-layout">
  <header class="header">
    <div class="header-top">
      <div class="header-brand">Monitoreo de Rutas</div>
      <div id="planStatus" class="text-xs">Sin planificación</div>
<button id="btnNameToggle" onclick="toggleNameMode()"
  style="font-size:9px;font-weight:700;padding:3px 8px;border-radius:var(--r-xs);
         border:1px solid var(--border);background:var(--bgCardAlt);
         color:var(--textSub);cursor:pointer;font-family:var(--font-base)">
  VEH → PAT
</button>
    </div>
    <div class="tabs-container"><div class="tabs-wrapper">
      <button class="tab-btn active" data-tab="configurar">Configurar</button>
      <button class="tab-btn" data-tab="mapa">Mapa <span id="badgeMapa" class="tab-badge">0</span></button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="tabla">Tabla</button>
      <button class="tab-btn" data-tab="isos">ISOs</button>
      <button class="tab-btn" data-tab="incidencias">Incidencias <span id="badgeInc" class="tab-badge">0</span></button>
      <button class="tab-btn" data-tab="consultar">Consultar</button>
      <button class="tab-btn" data-tab="resumen">Resumen</button>
      <button class="tab-btn" data-tab="grafico">Gráfico <span id="badgeGrafico" class="tab-badge" style="display:none"></span></button>
    </div></div>
    <div id="tabHelp" class="tab-help"></div>
  </header>
  <main class="main-content">
    <section class="tab-pane active" data-pane="configurar"><div class="main-padded"><div class="container" id="configRoot"></div></div></section>
    <section class="tab-pane" data-pane="mapa"><div class="map-layout">
      <aside class="map-sidebar" id="mapSidebar"></aside>
      <div class="map-container">
        <div class="map-toolbar" id="mapToolbar"></div>
        <div id="leafmap"></div>
      </div>
    </div></section>
    <section class="tab-pane" data-pane="dashboard"><div class="main-padded"><div class="container-lg" id="dashRoot"></div></div></section>
    <section class="tab-pane" data-pane="tabla"><div class="main-padded"><div class="container-lg" id="tablaRoot"></div></div></section>
    <section class="tab-pane" data-pane="isos"><div class="main-padded"><div class="container-lg" id="isosRoot"></div></div></section>
    <section class="tab-pane" data-pane="incidencias"><div class="main-padded"><div class="container-lg" id="incRoot"></div></div></section>
    <section class="tab-pane" data-pane="consultar"><div class="main-padded"><div class="container-lg" id="consultarRoot"></div></div></section>
    <section class="tab-pane" data-pane="resumen"><div class="main-padded"><div class="container-lg" id="resumenRoot"></div></div></section>
    <section class="tab-pane" data-pane="grafico" style="position:relative;overflow:hidden">
      <div id="graficoRoot" style="position:absolute;inset:0;overflow:auto"></div>
    </section>
  </main>
  <div id="imgModal" style="display:none"></div>
  <div class="toast"></div>
<script>
/* ═══════ STATE ═══════ */
const SR_BASE = 'https://app.simpliroute.com';
const SR_TOKEN_KEY = 'mr_sr_token';
const PLAN_KEY = 'mr_plan_v1';

let plan      = null;
let report    = null;
let srData    = null;
let csvData   = null;
let _csvRows  = null;
let _nameMode = 'veh';
let _vehNotes = {};

/* ═══════ SELF-TEST ═══════ */
const TESTS=[];
function test(name,fn){TESTS.push({name,fn});}
function assertEq(a,b,msg){ if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error((msg||'')+` expected ${JSON.stringify(b)} got ${JSON.stringify(a)}`); }
function runSelfTests(){
  let pass=0,fail=0; const out=[];
  for(const t of TESTS){ try{t.fn();pass++;out.push('✓ '+t.name);}catch(e){fail++;out.push('✗ '+t.name+' — '+e.message);} }
  console.log(out.join('\n')); console.log(`\n${pass} passed, ${fail} failed`);
  if(location.hash.includes('selftest')){
    const b=document.createElement('div');
    b.style.cssText='position:fixed;top:8px;right:8px;z-index:3000;background:#18181B;color:#fff;font:11px/1.5 monospace;padding:10px;border-radius:6px;max-width:420px;max-height:90vh;overflow:auto;white-space:pre-wrap';
    b.textContent=out.join('\n')+`\n\n${pass} passed, ${fail} failed`;
    document.body.appendChild(b);
  }
  return{pass,fail};
}

/* ═══════ PARSING UTILS ═══════ */
function detectSep(line){ const s=(line.match(/;/g)||[]).length, c=(line.match(/,/g)||[]).length; return s>=c?';':','; }
function parseRow(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===sep&&!q){ out.push(cur);cur=''; } else cur+=ch; }
  out.push(cur); return out.map(s=>s.trim());
}
function getKey(row,key){ const k=Object.keys(row).find(k=>k.trim().toLowerCase()===key.toLowerCase()); return k?row[k]:null; }
function findCol(row,variants){ const keys=Object.keys(row);
  return keys.find(k=>variants.some(v=>k.toLowerCase().trim()===v.toLowerCase())) ||
         keys.find(k=>variants.some(v=>k.toLowerCase().includes(v.toLowerCase()))) || null; }
function cleanStr(s){ return s?String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim():''; }
function parseNum(v){ if(typeof v==='number')return v; let s=String(v).trim();
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(',','.');
  return parseFloat(s)||0; }
function toSecs(v){ if(v==null||v==='')return NaN; const s=String(v).trim();
  const m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); if(!m)return NaN;
  return (+m[1])*3600+(+m[2])*60+(+(m[3]||0)); }
function cleanIso(s){ return s?String(s).trim().toUpperCase().replace(/\s+/g,''):''; }
function getReportRow(iso,rep){
  if(!rep||!rep.byIso)return null;
  return rep.byIso[iso]||rep.byIso[cleanIso(iso)]||null;
}
function parseCheckoutDt(val){
  if(!val||val==='')return null;
  if(val instanceof Date)return isNaN(val.getTime())?null:val;
  const s=String(val).trim();
  const d=new Date(s); if(!isNaN(d.getTime()))return d;
  const m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate(),+m[1],+m[2],+(m[3]||0)); }
  return null;
}
function fmtTime(dt){ if(!dt)return'—'; return dt.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }

/* ═══════ MOTIVOS ═══════ */
function getMotivo3(raw){
  if(!raw||!raw.trim())return'Transporte No Gestiona';
  const m=raw.toUpperCase().trim();
  if(m.includes('SIN MORADOR')||m.includes('MORADOR'))return'Sin Moradores';
  if(m.includes('DIRECCI')||m.includes('SIN INFORMACI'))return'Problema de Dirección';
  if(m.includes('SINIESTRO'))return'Siniestro En Calle';
  if(m.includes('PRODUCTO NO CARGADO')||m.includes('NO CARGADO'))return'Producto No Cargado';
  if(m.includes('RECHAZ'))return'Cliente Rechaza';
  return'Transporte No Gestiona';
}
function getMotivo2(m3){ return(m3==='Sin Moradores'||m3==='Problema de Dirección'||m3==='Cliente Rechaza')?'Cliente':'Transporte'; }
function getVehType(v){
  const u=String(v||'').toUpperCase();
  if(u.includes('AUX'))return'VAUX';
  if(/VPR|\bPR\d+|\bPROY/i.test(u))return'VPR';
  if(/VPV|\bPV\d+|\bPOSTV/i.test(u))return'VPV';
  return'Normal';
}

/* ═══════ PLAN PARSER ═══════ */
function comunaFromDir(dir){
  if(!dir)return''; const parts=String(dir).split(',').map(p=>p.trim()).filter(Boolean);
  if(!parts.length)return'';
  const last=cleanStr(parts[parts.length-1]);
  if(last==='CHILE'&&parts.length>=2)return cleanStr(parts[parts.length-2]);
  return last;
}
function parsePlan(rows){
  if(!rows||!rows.length)return[];
  const k={
    veh:findCol(rows[0],['vehículo','vehiculo','vehicle','ruta']),
    iso:findCol(rows[0],['título','titulo','title','iso','parentorder']),
    lat:findCol(rows[0],['latitud','lat','latitude','y','coord_y']),
    lng:findCol(rows[0],['longitud','lng','lon','longitude','x','coord_x']),
    dir:findCol(rows[0],['dirección','direccion','address']),
    eta:findCol(rows[0],['tiempo estimado de llegada','eta','hora']),
    ord:findCol(rows[0],['orden','parada','secuencia','stop','sequence'])
  };
  const stops=[];
  for(const r of rows){
    const iso=String((k.iso?r[k.iso]:'')||'').trim();
    const isoU=cleanStr(iso);
    if(!iso||isoU==='INICIO'||isoU==='FIN'||isoU==='INICIO/FIN')continue;
    const lat=k.lat?parseNum(r[k.lat]):NaN, lng=k.lng?parseNum(r[k.lng]):NaN;
    if(!lat||!lng||isNaN(lat)||isNaN(lng))continue;
    const dir=k.dir?String(r[k.dir]||''):'';
    stops.push({ iso, vehInicial:String((k.veh?r[k.veh]:'')||'').trim().toUpperCase(),
      vehFinal:'', lat, lng, direccion:dir, comuna:comunaFromDir(dir),
      orden:k.ord?parseNum(r[k.ord]):NaN, eta:k.eta?String(r[k.eta]||''):'' });
  }
  const byVeh={}; stops.forEach((s,i)=>{ (byVeh[s.vehInicial]=byVeh[s.vehInicial]||[]).push({s,i}); });
  Object.values(byVeh).forEach(arr=>{
    const hasOrd=arr.every(x=>!isNaN(x.s.orden));
    arr.sort((a,b)=>hasOrd?a.s.orden-b.s.orden:(toSecs(a.s.eta)||a.i)-(toSecs(b.s.eta)||b.i));
    arr.forEach((x,idx)=>x.s.orden=idx+1);
  });
  stops.sort((a,b)=>a.vehInicial.localeCompare(b.vehInicial)||a.orden-b.orden);
  return stops;
}

/* ═══════ MATRIZ RTE TO ═══════ */
function buildConvMap(rows){
  const map={}; if(!rows||!rows.length)return map;
  const cVini=findCol(rows[0],['v inicial','v_inicial','veh inicial','veh_inicial','vehículo inicial','vehiculo inicial']);
  const cVfin=findCol(rows[0],['v final','v_final','veh final','veh_final','vehículo final','vehiculo final']);
  rows.forEach(r=>{ const a=r[cVini]; if(a)map[String(a).trim().toUpperCase()]=String(r[cVfin]||'').trim().toUpperCase(); });
  return map;
}
function applyMatriz(stops,convMap){
  stops.forEach(s=>{ s.vehFinal=(convMap&&convMap[s.vehInicial])||s.vehInicial; });
}

/* ═══════ BUILD + PERSIST ═══════ */
function buildPlan(planRows,matrizRows){
  const stops=parsePlan(planRows);
  applyMatriz(stops,buildConvMap(matrizRows));
  const vehicles={};
  stops.forEach(s=>{ const v=vehicles[s.vehFinal]=vehicles[s.vehFinal]||{vehFinal:s.vehFinal,vehIniciales:new Set(),stopCount:0};
    v.vehIniciales.add(s.vehInicial); v.stopCount++; });
  Object.values(vehicles).forEach(v=>v.vehIniciales=[...v.vehIniciales]);
  return{ savedAt:new Date().toISOString(), stops, vehicles };
}

/* ═══════ REPORTE PARSER ═══════ */
function normEstado(e){
  const s=(e||'').toLowerCase().replace(/[\s_-]/g,'');
  if(/terminado|complet|entregado|success|delivered/.test(s))return'terminado';
  if(/enruta|inroute|inprogress|dispatched/.test(s))return'enruta';
  if(/pendiente|pending|failed|noentregado|notdelivered/.test(s))return'pendiente';
  return'';
}
function parseReporte(rows){
  const groups={};
  for(const row of rows){
    const com=String(getKey(row,'Commerce')||'').trim().toUpperCase(); if(!com.startsWith('IK'))continue;
    const iso=String(getKey(row,'ParentOrder')||'').trim(); if(!iso)continue;
    (groups[iso]=groups[iso]||[]).push(row);
  }
  const byIso={};
  for(const iso in groups){
    let rs=groups[iso];
    if(rs.length>1){ const eff=rs.filter(r=>!(getKey(r,'Estado')||'').toLowerCase().includes('planificado')); if(eff.length)rs=eff; }
    const row=rs.find(r=>normEstado(getKey(r,'Estado'))==='terminado')
            ||rs.find(r=>normEstado(getKey(r,'Estado'))==='pendiente')||rs[0];
    const estado=String(getKey(row,'Estado')||'').trim();
    const motivoRaw=String(getKey(row,'Motivo No Entrega')||getKey(row,'MotivoNoEntrega')||getKey(row,'Motivo')||'').trim();
    const motivo3=getMotivo3(motivoRaw);
    const entry={
      patente:String(getKey(row,'Patente')||'').trim(),
      region:String(getKey(row,'Region')||'').trim(),
      empresa:String(getKey(row,'Empresa')||getKey(row,'Transportista')||'').trim(),
      estado, estadoNorm:normEstado(estado), motivoRaw, motivo3, motivo2:getMotivo2(motivo3),
      comentario:String(getKey(row,'Comentario No Entrega')||getKey(row,'ComentarioNoEntrega')||'').trim(),
      imageUrl:String(getKey(row,'ImageUrl')||getKey(row,'Foto')||'').trim()
    };
    byIso[iso]=entry;
    const isoC=cleanIso(iso); if(isoC!==iso&&!byIso[isoC])byIso[isoC]=entry;
  }
  return{ loadedAt:new Date().toISOString(), byIso };
}
function parseCSVStandalone(rows) {
  const byPat = {};
  for (const row of rows) {
    const com = String(getKey(row,'Commerce')||'').trim().toUpperCase();
    if (!com.startsWith('IK') && !com.startsWith('I')) continue;
    const pat = String(getKey(row,'Patente')||'').trim(); if (!pat) continue;
    const iso = String(getKey(row,'ParentOrder')||'').trim(); if (!iso) continue;
    const region = String(getKey(row,'Region')||'Sin Región').trim();
    const empresa = String(getKey(row,'Empresa')||getKey(row,'Transportista')||'').trim();
    const estadoRaw = String(getKey(row,'Estado')||'').trim();
    const estadoN = normEstado(estadoRaw);
    const motivoRaw = String(getKey(row,'Motivo No Entrega')||getKey(row,'MotivoNoEntrega')||getKey(row,'Motivo')||'').trim();
    if (!byPat[pat]) byPat[pat] = {
      patente: pat, region, empresa,
      isos: new Set(), terminados: new Set(), enruta: new Set(),
      pendientes: new Set(), rebajadas: new Set(), rows: []
    };
    const p = byPat[pat];
    if (!p.region && region) p.region = region;
    if (!p.empresa && empresa) p.empresa = empresa;
    p.isos.add(iso);
    if (estadoN === 'terminado') p.terminados.add(iso);
    else if (estadoN === 'enruta') p.enruta.add(iso);
    else if (estadoN === 'pendiente') {
      if (motivoRaw) p.rebajadas.add(iso);
      else p.pendientes.add(iso);
    }
    p.rows.push(row);
  }
  const vehicles = {};
  Object.values(byPat).forEach(p => {
    const total = p.isos.size;
    const avance = total ? Math.round(p.terminados.size / total * 100) : 0;
    vehicles[p.patente] = {
      vehFinal: p.patente, patente: p.patente, region: p.region,
      empresa: p.empresa, conductor: '',
      total, terminados: p.terminados.size, enruta: p.enruta.size,
      rebajadas: p.rebajadas.size, pendientes: p.pendientes.size,
      avance, hechos: p.terminados.size, iniciada: (p.terminados.size + p.enruta.size + p.rebajadas.size) > 0,
      tipo: 'Normal'
    };
  });
  const g = { total:0, terminados:0, enruta:0, rebajadas:0, pendientes:0, avance:0, iniciadas:0 };
  Object.values(vehicles).forEach(v => {
    g.total += v.total; g.terminados += v.terminados; g.enruta += v.enruta;
    g.rebajadas += v.rebajadas; g.pendientes += v.pendientes;
    if (v.iniciada) g.iniciadas++;
  });
  g.avance = g.total ? Math.round(g.terminados / g.total * 100) : 0;
  return { vehicles, global: g, byPat, loadedAt: new Date().toISOString() };
}

/* ═══════ SR API ═══════ */
const SR_PROXIES=[
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.org/?${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];
async function fetchSrVisitas(token, date){
  if(!token)throw new Error('Sin token configurado');
  const url=`${SR_BASE}/v1/routes/visits/?planned_date=${date}`;
  const attempts=[
    {url, headers:{'Authorization':`Token ${token}`,'Accept':'application/json'}},
    ...SR_PROXIES.map(fn=>({url:fn(url), headers:{'Authorization':`Token ${token}`,'x-requested-with':'XMLHttpRequest'}}))
  ];
  for(const a of attempts){
    let resp;
    try{ resp=await fetch(a.url,{headers:a.headers}); }catch{ continue; }
    if(resp.status===401||resp.status===403)throw new Error('Token inválido o sin permisos');
    if(!resp.ok) continue;
    const data=await resp.json();
    return Array.isArray(data)?data:(data.results||[]);
  }
  throw new Error('No se puede conectar con SimpliRoute (directo y proxies fallaron)');
}
function parseApiVisits(results){
  if(!results||!results.length)return{byIso:{},byVeh:{}};
  const byIso={},byVeh={};
  for(const v of results){
    const isoRaw=String(v.title||v.tracking_id||'').trim(); if(!isoRaw)continue;
    const iso=cleanIso(isoRaw);
    const veh=String(v.vehicle_name||'').trim().toUpperCase();
    const con=String(v.driver_name||'').trim();
    const co=v.checkout_time||'';
    const est=String(v.status||'').trim();
    if(!byIso[iso])byIso[iso]={veh,con,checkout:co,est,obs:''};
    if(veh){
      if(!byVeh[veh])byVeh[veh]={veh,conductor:con,tipo:getVehType(veh),isos:[]};
      if(!byVeh[veh].conductor&&con)byVeh[veh].conductor=con;
      byVeh[veh].isos.push({iso,checkout:co,est});
    }
  }
  return{byIso,byVeh};
}

/* ═══════ JOIN + KPIs ═══════ */
const STATUS={
  terminado:{key:'terminado',label:'Terminado',color:'#16A34A'},
  enruta:   {key:'enruta',   label:'En Ruta',  color:'#2563EB'},
  rebajada: {key:'rebajada', label:'Rebajada', color:'#DC2626'},
  pendiente:{key:'pendiente',label:'Pendiente',color:'#A1A1AA'},
  sindato:  {key:'sindato',  label:'Sin dato', color:'#D4D4D8'}
};
function statusOf(stop, rep){
  const r=getReportRow(stop.iso,rep);
  if(r&&r.estadoNorm){
    if(r.estadoNorm==='terminado')return STATUS.terminado;
    if(r.estadoNorm==='enruta')return STATUS.enruta;
    if(r.estadoNorm==='pendiente')return(r.motivoRaw&&r.motivoRaw.trim())?STATUS.rebajada:STATUS.pendiente;
  }
  const a=srData&&srData.byIso&&srData.byIso[cleanIso(stop.iso)];
  if(a){
    if(a.checkout)return STATUS.terminado;
    const en=normEstado(a.est);
    if(en==='terminado')return STATUS.terminado;
    if(en==='enruta')return STATUS.enruta;
    if(en==='pendiente')return STATUS.pendiente;
  }
  return STATUS.sindato;
}
function computeKPIs(p, rep){
  const patCounts={};
  (p?p.stops:[]).forEach(s=>{
    const r=getReportRow(s.iso,rep);
    if(r&&r.patente){
      if(!patCounts[s.vehFinal])patCounts[s.vehFinal]={};
      patCounts[s.vehFinal][r.patente]=(patCounts[s.vehFinal][r.patente]||0)+1;
    }
  });
  const domPat=vf=>{ const c=patCounts[vf]; if(!c)return''; return Object.keys(c).reduce((b,p)=>(!b||c[p]>c[b])?p:b,''); };
  const vehicles={}, global={total:0,terminados:0,enruta:0,rebajadas:0,pendientes:0,sindato:0,iniciadas:0};
  const bump=(o,st)=>o[st==='terminado'?'terminados':st==='enruta'?'enruta':st==='rebajada'?'rebajadas':st==='pendiente'?'pendientes':'sindato']++;
  (p?p.stops:[]).forEach(s=>{
    const r=getReportRow(s.iso,rep);
    if(r&&!r.patente)return; // Excluir ISOs con datos pero sin patente
    const st=statusOf(s,rep).key;
    const v=vehicles[s.vehFinal]=vehicles[s.vehFinal]||{
      vehFinal:s.vehFinal,patente:'',region:'',conductor:'',tipo:getVehType(s.vehFinal),
      total:0,terminados:0,enruta:0,rebajadas:0,pendientes:0,sindato:0
    };
    v.total++; bump(v,st);
    if(r&&r.region&&!v.region)v.region=r.region;
    global.total++; bump(global,st);
  });
  Object.values(vehicles).forEach(v=>{
    v.patente=domPat(v.vehFinal);
    if(srData&&srData.byVeh&&srData.byVeh[v.vehFinal]){
      const sv=srData.byVeh[v.vehFinal];
      if(!v.conductor)v.conductor=sv.conductor||'';
    }
    v.hechos=v.terminados;
    v.avance=v.total?Math.round(v.terminados/v.total*100):0;
    v.iniciada=(v.terminados+v.enruta+v.rebajadas)>0;
  });
  global.iniciadas=Object.values(vehicles).filter(v=>v.iniciada).length;
  global.avance=global.total?Math.round(global.terminados/global.total*100):0;
  return{vehicles,global};
}
function computePvAdherencia(vehFinal){
  if(!srData||!srData.byVeh||!srData.byVeh[vehFinal]||!plan)return null;
  const stops=plan.stops.filter(s=>s.vehFinal===vehFinal);
  const srVeh=srData.byVeh[vehFinal];
  const coMap={};
  srVeh.isos.forEach(item=>{ const dt=parseCheckoutDt(item.checkout); if(dt)coMap[item.iso]=dt; });
  const withCo=stops
    .map(s=>({iso:cleanIso(s.iso),parT:s.orden,dt:coMap[cleanIso(s.iso)]}))
    .filter(x=>x.dt).sort((a,b)=>a.dt-b.dt);
  withCo.forEach((x,i)=>x.idxR=i+1);
  const byPlan=[...withCo].sort((a,b)=>(a.parT||0)-(b.parT||0));
  byPlan.forEach((x,i)=>x.expectedR=i+1);
  const n=withCo.length; let c0=0,c1=0,c3=0;
  withCo.forEach(x=>{ const d=Math.abs(x.idxR-x.expectedR); if(d===0)c0++; if(d<=1)c1++; if(d<=3)c3++; });
  const pct=(v,t)=>t?Math.round(v/t*100)+'%':'—';
  return{ n, total:stops.length,
    primer:withCo[0]?fmtTime(withCo[0].dt):'—', ultimo:withCo[n-1]?fmtTime(withCo[n-1].dt):'—',
    h0:pct(c0,n), h1:pct(c1,n), h3:pct(c3,n),
    cumple:n>0&&c0===n?'Cumple':'No cumple' };
}

function visibleStops(){
  if(!plan)return[];
  return plan.stops.filter(s=>{
    const st=statusOf(s,report).key; if(!filters.estados.has(st))return false;
    if(filters.region){ const r=getReportRow(s.iso,report); if(!r||r.region!==filters.region)return false; }
    if(filters.q){ const q=cleanStr(filters.q); const r=getReportRow(s.iso,report);
      if(!(cleanStr(s.iso).includes(q)||(r&&cleanStr(r.patente).includes(q))||cleanStr(s.vehFinal).includes(q)))return false; }
    return true;
  });
}

  window._layerStops=L.layerGroup().addTo(window._map);
  window._layerLines=L.layerGroup().addTo(window._map);

function renderMap(){
  if(!plan)return;

/* ═══════ BUILD DASHBOARD DATA ═══════ */
function buildDataForDashboard(){
  const rows=_csvRows||[];
  const processed={};
  const rawRowsByPO={};
  if(rows.length){
    rows.forEach(row=>{
      const commerce=(getKey(row,'Commerce')||'').trim();
      const patente=(getKey(row,'Patente')||'').trim();
      if(!commerce.toLowerCase().startsWith('i')||!patente)return;
      const region=(getKey(row,'Region')||'Sin Región').trim();
      const estado=(getKey(row,'Estado')||'Sin Estado').trim();
      const po=(getKey(row,'ParentOrder')||'').trim();if(!po)return;
      const gestion=(getKey(row,'Gestión')||getKey(row,'GESTIÓN')||'DIRECTO').trim().toUpperCase();
      const empresa=(getKey(row,'Empresa')||getKey(row,'Transportista')||'Sin Empresa').trim();
      if(!rawRowsByPO[po])rawRowsByPO[po]=[];
      rawRowsByPO[po].push({...row,_empresa:empresa});
      if(!processed[region])processed[region]={orders:new Set(),estados:{},gestiones:{},patentes:{}};
      processed[region].orders.add(po);
      if(!processed[region].estados[estado])processed[region].estados[estado]=new Set();
      processed[region].estados[estado].add(po);
      if(!processed[region].gestiones[gestion])processed[region].gestiones[gestion]=0;
      processed[region].gestiones[gestion]++;
      const pats=processed[region].patentes;
      if(!pats[patente])pats[patente]={orders:new Set(),estados:{},gestiones:{}};
      pats[patente].orders.add(po);
      if(!pats[patente].estados[estado])pats[patente].estados[estado]=new Set();
      pats[patente].estados[estado].add(po);
      if(!pats[patente].gestiones[gestion])pats[patente].gestiones[gestion]=0;
      pats[patente].gestiones[gestion]++;
    });
  } else if(plan&&report){
    plan.stops.forEach(s=>{
      const r=getReportRow(s.iso,report);
      const region=r?.region||'Sin Región';
      const patente=r?.patente||s.vehFinal;
      let estado='Planificado';
      if(r?.estadoNorm==='terminado')estado='Terminado';
      else if(r?.estadoNorm==='enruta')estado='En Ruta';
      else if(r?.estadoNorm==='pendiente')estado='Pendiente';
      const po=s.iso;
      if(!processed[region])processed[region]={orders:new Set(),estados:{},gestiones:{},patentes:{}};
      processed[region].orders.add(po);
      if(!processed[region].estados[estado])processed[region].estados[estado]=new Set();
      processed[region].estados[estado].add(po);
      const pats=processed[region].patentes;
      if(!pats[patente])pats[patente]={orders:new Set(),estados:{},gestiones:{}};
      pats[patente].orders.add(po);
      if(!pats[patente].estados[estado])pats[patente].estados[estado]=new Set();
      pats[patente].estados[estado].add(po);
    });
  }
  const incidenciasByPatente={};
  Object.entries(rawRowsByPO).forEach(([,poRows])=>{
    if(!poRows.length)return;
    const firstRow=poRows[0];
    const patente=(getKey(firstRow,'Patente')||'').trim();if(!patente)return;
    const region=(getKey(firstRow,'Region')||'Sin Región').trim();
    const empresa=firstRow._empresa||'Sin Empresa';
    const allPend=poRows.every(r=>(getKey(r,'Estado')||'').trim().toLowerCase().includes('pendiente'));
    if(!allPend)return;
    if(!incidenciasByPatente[patente])incidenciasByPatente[patente]={patente,region,empresa,totalFotos:0,eventos:[],incidentCount:0};
    const seenE=new Set();
    poRows.forEach(row=>{
      const imgUrl=(getKey(row,'ImageUrl')||getKey(row,'Foto')||'').trim();
      const obs=(getKey(row,'Comentario No Entrega')||getKey(row,'ComentarioNoEntrega')||getKey(row,'Comentario')||'').trim();
      const iso=(getKey(row,'ParentOrder')||'').trim();
      const ek=imgUrl+'|'+obs;if(seenE.has(ek))return;seenE.add(ek);
      const motivo=(getKey(row,'Motivo No Entrega')||getKey(row,'MotivoNoEntrega')||getKey(row,'Motivo')||'').trim();
      const fotos=imgUrl.split(',').map(s=>s.trim().replace(/^[\[\]"']+|[\[\]"']+$/g,'').trim()).filter(s=>s.startsWith('http'));
      incidenciasByPatente[patente].eventos.push({
        id:iso+'_'+Math.random().toString(36).substr(2,4),iso,
        fecha:(getKey(row,'Fechaentregareal')||getKey(row,'Fecha')||'Sin fecha').trim(),
        motivo:motivo||(imgUrl?'Registro Fotográfico':'Incidencia'),
        comentario:obs,fotos,region,
        comuna:(getKey(row,'Localidad')||getKey(row,'Comuna')||'').trim(),
        estado:(getKey(row,'Estado')||'').trim()
      });
      incidenciasByPatente[patente].totalFotos+=fotos.length;
      incidenciasByPatente[patente].incidentCount++;
    });
  });
  if(!Object.keys(processed).length)return null;
  return{data:{regions:processed,incidenciasByPatente},rawRows:rows,allRegions:Object.keys(processed).sort()};
}

/* ═══════ FOTOS ═══════ */
const PHOTO_FALLBACK='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160"><rect width="100%" height="100%" fill="#1f1f1f"/><text x="50%" y="50%" fill="#999" font-size="13" text-anchor="middle" dominant-baseline="middle">Foto no disponible</text></svg>');
// Convierte URLs de Google Cloud Storage al formato directo que sí renderiza en <img>
function directPhotoUrl(url){
  if(!url)return'';
  const m=url.match(/storage\.googleapis\.com\/([^/]+)\/(.+)/)||url.match(/storage\.cloud\.google\.com\/([^/]+)\/(.+)/);
  if(m)return`https://storage.googleapis.com/${m[1]}/${m[2]}`;
  return url;
}
// Una celda de "ImageUrl"/"Foto" puede traer varias URLs (separadas por coma) y/o envueltas en []/comillas
function parsePhotoUrls(raw){
  if(!raw)return[];
  return String(raw).split(',')
    .map(s=>s.trim().replace(/^[\[\]"']+|[\[\]"']+$/g,'').trim())
    .filter(s=>s.startsWith('http'))
    .map(directPhotoUrl);
}
function photoErr(img){ img.onerror=null; img.src=PHOTO_FALLBACK; }
// Renderiza TODAS las fotos como miniaturas clicables (abre el visor en la que se pulsa)
function photoThumbs(raw){
  const urls=parsePhotoUrls(raw);
  if(!urls.length)return'';
  const arg=esc(String(raw)).replace(/'/g,'&#39;');
  return '<div class="photo-strip">'+urls.map((u,i)=>
    `<img class="inc-photo" src="${esc(u)}" onclick="openPhotos('${arg}',${i})" onerror="photoErr(this)" loading="lazy" alt="foto ${i+1}">`
  ).join('')+'</div>';
}
let _imgModal={images:[],idx:0};
function openPhotos(raw,startIdx){
  const imgs=Array.isArray(raw)?raw:parsePhotoUrls(raw);
  if(!imgs.length)return;
  _imgModal={images:imgs,idx:Math.max(0,Math.min(startIdx||0,imgs.length-1))};
  renderImgModal();
}
function openImgModal(src){ openPhotos(src,0); } // compat
function imgModalStep(d){
  const n=_imgModal.images.length; if(!n)return;
  _imgModal.idx=(_imgModal.idx+d+n)%n;
  renderImgModal();
}
function renderImgModal(){
  const m=document.getElementById('imgModal');
  const{images,idx}=_imgModal;
  if(!images.length){ closeImgModal(); return; }
  const nav=images.length>1?`<div class="img-overlay-nav">
      <button class="img-nav-btn" id="imgPrev">◀</button>
      <span class="img-nav-count">${idx+1} / ${images.length}</span>
      <button class="img-nav-btn" id="imgNext">▶</button>
    </div>`:'';
  m.innerHTML=`<div class="img-overlay-content">
    <button class="img-overlay-close" id="imgClose">✕</button>
    <img id="imgMain" alt="foto" style="max-width:90vw;max-height:82vh;border-radius:4px;display:block;background:#111">
    ${nav}
  </div>`;
  const img=m.querySelector('#imgMain');
  img.onerror=()=>photoErr(img);
  img.src=images[idx];
  m.querySelector('#imgClose').onclick=closeImgModal;
  if(images.length>1){
    m.querySelector('#imgPrev').onclick=()=>imgModalStep(-1);
    m.querySelector('#imgNext').onclick=()=>imgModalStep(1);
  }
  m.style.display='flex';
  m.onclick=e=>{ if(e.target===m)closeImgModal(); };
}
function closeImgModal(){ const m=document.getElementById('imgModal'); m.style.display='none'; m.innerHTML=''; _imgModal={images:[],idx:0}; }
document.addEventListener('keydown',e=>{
  if(_imgModal.images.length===0)return;
  if(e.key==='Escape')closeImgModal();
  else if(e.key==='ArrowLeft')imgModalStep(-1);
  else if(e.key==='ArrowRight')imgModalStep(1);
});

/* ═══════ CONSULTAR (LOTE) ═══════ */
function consultarBuscar(){
  const ta=document.getElementById('cqText');
  const raw=ta?ta.value:_consultarISOs;
  _consultarISOs=raw;
  const isos=String(raw).split(/[\n\r,;\t ]+/).map(s=>s.trim()).filter(Boolean);
  if(!isos.length){ _consultarResults=[]; renderConsultar(); return; }
  // Índice de filas de reporte (solo e-commerce: Commerce empieza con I) por ISO limpio
  const byIso={};
  (_csvRows||[]).forEach(r=>{
    const com=String(getKey(r,'Commerce')||'').trim().toUpperCase(); if(!com.startsWith('I'))return;
    const po=cleanIso(getKey(r,'ParentOrder')); if(!po)return;
    (byIso[po]=byIso[po]||[]).push(r);
  });
  // Índice de paradas del plan por ISO limpio (para vehículo/dirección)
  const planByIso={};
  if(plan)plan.stops.forEach(s=>{ planByIso[cleanIso(s.iso)]=s; });
  const res=[];
  isos.forEach(isoRaw=>{
    const iso=cleanIso(isoRaw);
    const stop=planByIso[iso];
    let matches=byIso[iso]||[];
    if(matches.length>1){
      const nonPlan=matches.filter(r=>!String(getKey(r,'Estado')||'').toLowerCase().includes('planificado'));
      if(nonPlan.length)matches=nonPlan;
    }
    if(matches.length){
      const states=new Set(matches.map(m=>String(getKey(m,'Estado')||'').toLowerCase()));
      const seen=new Set();
      matches.forEach(row=>{
        const estado=String(getKey(row,'Estado')||'').trim();
        const patente=String(getKey(row,'Patente')||'').trim();
        const key=estado+'|'+patente; if(seen.has(key))return; seen.add(key);
        const motivoRaw=String(getKey(row,'Motivo No Entrega')||getKey(row,'MotivoNoEntrega')||getKey(row,'Motivo')||'').trim();
        const motivo3=getMotivo3(motivoRaw), motivo2=getMotivo2(motivo3);
        res.push({iso:isoRaw,found:true,patente,veh:stop?stop.vehFinal:'',estado,
          direccion:String(getKey(row,'Direccion')||getKey(row,'Dirección')||(stop&&stop.direccion)||'').trim(),
          comentario:String(getKey(row,'Comentario No Entrega')||getKey(row,'ComentarioNoEntrega')||'').trim(),
          motivoRaw,motivo3,motivo2,
          imageUrl:String(getKey(row,'ImageUrl')||getKey(row,'Foto')||'').trim(),
          multi:states.size>1});
      });
    } else if(stop){
      const r=getReportRow(stop.iso,report);
      res.push({iso:isoRaw,found:true,patente:r?r.patente:'',veh:stop.vehFinal,
        estado:r?r.estado:'(solo en planificación)',direccion:stop.direccion||'',
        comentario:r?r.comentario:'',motivoRaw:r?r.motivoRaw:'',motivo3:r?r.motivo3:'',motivo2:r?r.motivo2:'',
        imageUrl:r?r.imageUrl:'',multi:false});
    } else {
      res.push({iso:isoRaw,found:false,patente:'',veh:'',estado:'',direccion:'',comentario:'',motivoRaw:'',motivo3:'',motivo2:'',imageUrl:'',multi:false});
    }
  });
  _consultarResults=res;
  renderConsultar();
  showToast(`${res.filter(r=>r.found).length}/${res.length} encontrados`, res.some(r=>!r.found)?'warn':'ok');
}
function consultarFiltradas(){
  let r=_consultarResults;
  if(_consultarFilter==='found')r=r.filter(x=>x.found);
  else if(_consultarFilter==='notfound')r=r.filter(x=>!x.found);
  const q=cleanStr(_consultarSearch);
  if(q)r=r.filter(x=>cleanStr(x.iso).includes(q)||cleanStr(x.estado).includes(q)||cleanStr(x.direccion).includes(q)||cleanStr(x.patente).includes(q)||cleanStr(x.veh).includes(q));
  return r;
}
function copyConsultar(){
  const r=consultarFiltradas(); if(!r.length){ showToast('Nada que copiar','warn'); return; }
  let t='ISO\tPatente\tVehículo\tEstado\tDirección\tMotivo\tComentario\tMotivo 3\tMotivo 2\tFotos\n';
  r.forEach(x=>{ const urls=parsePhotoUrls(x.imageUrl);
    t+=`${x.iso}${x.found?'':' [NO HALLADO]'}\t${x.patente}\t${x.veh}\t${x.estado}\t${x.direccion}\t${x.motivoRaw}\t${x.comentario}\t${x.motivo3}\t${x.motivo2}\t${urls.join(' ')}\n`; });
  navigator.clipboard?.writeText(t).then(()=>showToast('Tabla copiada','ok'));
}
function renderConsultar(){
  const el=document.getElementById('consultarRoot'); if(!el)return;
  const hasRows=!!(_csvRows&&_csvRows.length)||!!plan;
  const detected=String(_consultarISOs).split(/[\n\r,;\t ]+/).filter(s=>s.trim()).length;
  const results=_consultarResults;
  const filt=consultarFiltradas();
  const nFound=results.filter(r=>r.found).length;
  const nMiss=results.length-nFound;

  const left=`<div class="card">
    <div class="card-header"><h2>Ingresar ISOs</h2></div>
    <p class="text-xs" style="margin:0 0 8px;color:var(--textFaint)">Pega las ISOs a buscar: una por línea, o separadas por coma/espacio.</p>
    <textarea id="cqText" placeholder="Ej:\n123456\n123457, 123458" style="width:100%;min-height:200px;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-family:var(--font-mono);resize:vertical;outline:none;background:var(--bgCard);color:var(--text);box-sizing:border-box">${esc(_consultarISOs)}</textarea>
    <div class="text-xs" style="text-align:center;color:var(--textFaint);margin:8px 0">${detected?detected+' ISOs detectadas':'&nbsp;'}</div>
    <button class="btn-block" id="cqGo"${hasRows?'':' disabled'}>Consultar</button>
    <button class="btn btn-secondary" id="cqClear" style="width:100%;margin-top:6px">Limpiar</button>
    ${hasRows?'<p class="text-xs" style="color:var(--textFaint);margin-top:8px">Tip: Ctrl/Cmd + Enter para consultar.</p>':'<p class="text-xs" style="color:var(--orange);margin-top:8px">Carga un CSV de avance en Configurar para consultar con detalle.</p>'}
  </div>`;

  let right;
  if(!results.length){
    right=`<div class="card"><div class="empty-state" style="min-height:240px"><div class="empty-title">Sin resultados aún</div><div class="empty-body">Pega las ISOs a la izquierda y pulsa Consultar para ver estado, vehículo, motivo y fotos.</div></div></div>`;
  } else {
    const chips=[['all','Todos'],['found','✓ Encontrados ('+nFound+')'],['notfound','✗ No hallados ('+nMiss+')']]
      .map(([k,l])=>`<button class="cq-chip${_consultarFilter===k?' active':''}" data-filter="${k}">${l}</button>`).join('');
    const rowsHtml=filt.map(x=>{
      const urls=parsePhotoUrls(x.imageUrl);
      const arg=esc(String(x.imageUrl)).replace(/'/g,'&#39;');

function rebajadasList(){

    const r=getReportRow(s.iso,report); if(!r)return;
    out.push({iso:s.iso,vehFinal:s.vehFinal,patente:r.patente,comuna:s.comuna,region:r.region,
      motivo3:r.motivo3,motivo2:r.motivo2,motivoRaw:r.motivoRaw,comentario:r.comentario,imageUrl:r.imageUrl});
  }});
  return out.sort((a,b)=>a.vehFinal.localeCompare(b.vehFinal));
}

function copyRebajadas(reb){

  navigator.clipboard?.writeText(t).then(()=>showToast('Copiado','ok'));
}

function readFile(file){
  return new Promise((resolve,reject)=>{
    const name=file.name.toLowerCase(); const fr=new FileReader();
    fr.onerror=()=>reject(new Error('lectura'));
    if(name.endsWith('.csv')||name.endsWith('.txt')){
      fr.onload=()=>{ const text=String(fr.result).replace(/^﻿/,''); const lines=text.split(/\r?\n/).filter(l=>l.trim());
        if(!lines.length)return resolve([]);
        const sep=detectSep(lines[0]); const headers=parseRow(lines[0],sep);
        const rows=lines.slice(1).map(l=>{ const c=parseRow(l,sep); const o={}; headers.forEach((h,i)=>o[h]=c[i]!=null?c[i]:''); return o; });
        resolve(rows); };
      fr.readAsText(file,'UTF-8');
    } else {
      fr.onload=()=>{ const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
        const planSheet=wb.SheetNames.find(n=>n.toLowerCase().trim()==='plan');
        const sh=wb.Sheets[planSheet||wb.SheetNames[0]]; resolve(XLSX.utils.sheet_to_json(sh,{defval:''})); };
      fr.readAsArrayBuffer(file);
    }
  });
}
function makeUpload(id,label,hint){
  return`<div class="param-section"><div class="param-section-header"><span class="section-label">${label}</span><span id="${id}_badge" class="text-xs"></span></div>
    <div class="param-section-body"><label class="upload-zone" id="${id}">
      <div class="upload-filename" id="${id}_name">${hint}</div>
      <input type="file" accept=".csv,.xlsx,.xls,.txt" style="display:none"></label></div></div>`;
}
function wireUpload(id,onFile){
  const zone=document.getElementById(id); const input=zone.querySelector('input');
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');if(e.dataTransfer.files[0])handle(e.dataTransfer.files[0]);});
  input.addEventListener('change',()=>{if(input.files[0])handle(input.files[0]);});
  async function handle(f){ try{ const rows=await readFile(f); onFile(rows,f.name);
    document.getElementById(id+'_name').textContent=f.name; zone.classList.add('loaded');
    document.getElementById(id+'_badge').textContent=`${rows.length} filas`; }
    catch(e){ showToast('Error leyendo '+f.name,'error'); } }
}

  statusEl.textContent='Cargando…';
  document.getElementById('btnSrFetch').disabled=true;
  try{

    srData=parseApiVisits(results);
    const n=Object.keys(srData.byIso).length, nv=Object.keys(srData.byVeh).length;
    statusEl.textContent=`${n} visitas · ${nv} vehículos · ${date}`;

  }
}

function buildGraficoData() {
  const kpi = hasData() ? getKPI() : null;
  if (!kpi) return [];
  return Object.values(kpi.vehicles)
    .map(v => ({
      patente: dispName(v),
      altName: _nameMode === 'pat' ? v.vehFinal : (v.patente || ''),
      Terminado: v.terminados,
      'En Ruta': v.enruta,
      Pendiente: v.pendientes + (v.rebajadas || 0),
      total: v.total,
      avance: v.avance,
      dummy: 0.05,
      region: v.region || ''
    }))
    .filter(d => d.total > 0)
    .sort((a, b) => b.total - a.total);
}

function renderGrafico() {
  const root = document.getElementById('graficoRoot');
  if (!root) return;
  if (!window.GraficoChart) {
    root.innerHTML='<div class="empty-state"><div class="empty-title">Cargando gráfico…</div><div class="empty-body">Iniciando componentes…</div></div>';
    return;
  }
  window._graficoData = buildGraficoData();
  window._graficoNotes = _vehNotes;
  if (!window._graficoRoot) {
    window._graficoRoot = ReactDOM.createRoot(root);
  }
  window._graficoRoot.render(
    React.createElement(window.GraficoChart, {
      data: window._graficoData,
      notes: window._graficoNotes,
      onNoteChange: (veh, note) => { setVehNote(veh, note); renderGrafico(); }
    })
  );
}

<script type="text/babel">
(function(){

function tGrad(pct){const p=Math.max(0,Math.min(100,pct));if(p>=100)return{bg:'rgba(22,163,74,.18)',txt:'#16A34A'};if(p>=90)return{bg:'rgba(202,138,4,.15)',txt:'#CA8A04'};if(p>=50)return{bg:'rgba(234,88,12,.12)',txt:'#EA580C'};return{bg:'rgba(220,38,38,.12)',txt:'#DC2626'};}
function fPct(v){return parseFloat(v.toFixed(1)).toString().replace('.',',')+' %';}
function gMotivo3(raw){if(!raw||!raw.trim())return'Transporte No Gestiona';const m=raw.toUpperCase().trim();if(m.includes('SIN MORADOR')||m.includes('MORADOR'))return'Sin Moradores';if(m.includes('DIRECCI')||m.includes('SIN INFORMACI'))return'Problema de Dirección';if(m.includes('SINIESTRO'))return'Siniestro En Calle';if(m.includes('PRODUCTO NO CARGADO')||m.includes('NO CARGADO'))return'Producto No Cargado';if(m.includes('RECHAZ'))return'Cliente Rechaza';return'Transporte No Gestiona';}
function gMotivo2(m3){return(m3==='Sin Moradores'||m3==='Problema de Dirección'||m3==='Cliente Rechaza')?'Cliente':'Transporte';}
function getK(row,key){const k=Object.keys(row).find(k=>k.trim().toLowerCase()===key.toLowerCase());return k?row[k]:null;}

function KPICard({title,value,color,progress}){
  return <div style={{padding:'16px 18px',borderRadius:8,border:`1px solid ${DS.borderSoft}`,background:DS.bgCard,display:'flex',flexDirection:'column',gap:8}}>

    <div style={{fontSize:28,fontWeight:900,color:color||DS.text,fontFamily:DS.fontMono,lineHeight:1}}>{value}</div>
    {typeof progress==='number'&&<div style={{width:'100%',height:4,background:'rgba(0,0,0,0.06)',borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',background:color||DS.text,borderRadius:99,width:`${Math.min(100,progress)}%`,transition:'width 0.8s'}}/></div>}
  </div>;
}

function MRRegionDropdown({allRegions,selected,onChange}){
  const[open,setOpen]=React.useState(false);
  const[pos,setPos]=React.useState({top:0,left:0});
  const btnRef=React.useRef(null);const panelRef=React.useRef(null);
  const rmR=React.useMemo(()=>allRegions.filter(r=>r.toLowerCase().includes('metropolitana')),[allRegions]);
  const rxR=React.useMemo(()=>allRegions.filter(r=>!r.toLowerCase().includes('metropolitana')),[allRegions]);
  const isAll=selected.size===0;
  const isRM=!isAll&&rmR.length>0&&selected.size===rmR.length&&rmR.every(r=>selected.has(r));
  const isRX=!isAll&&rxR.length>0&&selected.size===rxR.length&&rxR.every(r=>selected.has(r));
  const label=isAll?'Todas las regiones':isRM?'RM':isRX?'RX':selected.size===1?[...selected][0]:`${selected.size} regiones`;
  const isChecked=r=>selected.size===0||selected.has(r);
  const toggle=r=>onChange(prev=>{const base=prev.size===0?new Set(allRegions):new Set(prev);if(base.has(r)){base.delete(r);if(base.size===0)return new Set();}else{base.add(r);if(base.size===allRegions.length)return new Set();}return base;});
  const handleOpen=()=>{if(btnRef.current){const rect=btnRef.current.getBoundingClientRect();setPos({top:rect.bottom+4,left:rect.left});}setOpen(o=>!o);};
  React.useEffect(()=>{const h=e=>{if(panelRef.current&&!panelRef.current.contains(e.target)&&btnRef.current&&!btnRef.current.contains(e.target))setOpen(false)};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  const qBtn=(lbl,active,fn)=><button key={lbl} onClick={fn} style={{padding:'3px 10px',borderRadius:99,border:`1px solid ${active?DS.blue:DS.border}`,background:active?DS.blueBg:'transparent',fontSize:9,fontWeight:700,cursor:'pointer',color:active?DS.blue:DS.textSub,fontFamily:DS.fontBase}}>{lbl}</button>;
  return <div style={{display:'inline-block'}}>
    <button ref={btnRef} onClick={handleOpen} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:6,border:`1px solid ${DS.border}`,background:DS.bgCardAlt,fontSize:11,fontWeight:700,cursor:'pointer',color:DS.textSub,fontFamily:DS.fontBase}}>
      Región: <span style={{color:DS.text}}>{label}</span><ChevDown size={12}/>
    </button>
    {open&&ReactDOM.createPortal(
      <div ref={panelRef} style={{position:'fixed',top:pos.top,left:pos.left,zIndex:9990,width:270,background:'#fff',border:`1px solid ${DS.border}`,borderRadius:8,boxShadow:'0 8px 30px rgba(0,0,0,0.15)',overflow:'hidden'}}>
        <div style={{padding:'8px 12px',borderBottom:`1px solid ${DS.borderSoft}`,display:'flex',gap:6,flexWrap:'wrap'}}>
          {qBtn('Todas',isAll,()=>onChange(new Set()))}
          {rmR.length>0&&qBtn('RM',isRM,()=>onChange(new Set(rmR)))}
          {rxR.length>0&&qBtn('RX',isRX,()=>onChange(new Set(rxR)))}
        </div>
        <div style={{maxHeight:260,overflowY:'auto',padding:'4px 0'}}>
          {allRegions.map(r=>{const active=isChecked(r);return <button key={r} onClick={()=>toggle(r)} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 14px',width:'100%',border:'none',background:'transparent',cursor:'pointer',fontSize:11,fontWeight:600,color:DS.text,fontFamily:DS.fontBase,textAlign:'left'}} onMouseEnter={e=>e.currentTarget.style.background=DS.bgHover} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${active?DS.blue:DS.border}`,background:active?DS.blue:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all 0.1s'}}>
              {active&&<span style={{color:'#fff',fontSize:9,lineHeight:1,fontWeight:900}}>✓</span>}
            </div>
            <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r}</span>
          </button>;})}
        </div>
      </div>,
      document.body
    )}
  </div>;
}

function MR_DashTab({data,rawRows,allRegions}){
  const dashRef=React.useRef(null);
  const[selRegions,setSelRegions]=React.useState(new Set());
  const[exporting,setExporting]=React.useState(false);
  const[excOvr,setExcOvr]=React.useState(new Set());
  const[motiOvr,setMotiOvr]=React.useState(new Set());
  const toggleMoti=React.useCallback(tipo=>setMotiOvr(prev=>{const n=new Set(prev);n.has(tipo)?n.delete(tipo):n.add(tipo);return n;}),[]);
  const deferred=React.useDeferredValue(selRegions);
  const filteredR=React.useMemo(()=>deferred.size===0?allRegions:allRegions.filter(r=>deferred.has(r)),[deferred,allRegions]);

  const kpis=React.useMemo(()=>{
    if(!data)return{total:0,terminados:0,enRuta:0,pendientes:0,avance:0};
    let total=0,terminados=0,enRuta=0,pendientes=0;
    filteredR.forEach(r=>{const rd=data.regions[r];if(!rd)return;total+=rd.orders.size;Object.keys(rd.estados).forEach(e=>{const v=rd.estados[e].size;const el=e.toLowerCase();if(el.includes('terminado'))terminados+=v;else if(el.includes('en ruta')||el.includes('enruta'))enRuta+=v;else if(el.includes('pendiente'))pendientes+=v;});});
    return{total,terminados,enRuta,pendientes,avance:total>0?Math.round((terminados/total)*100):0};
  },[data,filteredR]);

  const critPat=React.useMemo(()=>{
    if(!data)return[];
    const pm={};
    filteredR.forEach(r=>{const rd=data.regions[r];if(!rd)return;Object.entries(rd.patentes).forEach(([pat,pd])=>{if(!pm[pat])pm[pat]={patente:pat,total:0,terminados:0,pendientes:0};pm[pat].total+=pd.orders.size;Object.keys(pd.estados).forEach(e=>{const v=pd.estados[e].size;const el=e.toLowerCase();if(el.includes('terminado'))pm[pat].terminados+=v;if(el.includes('pendiente'))pm[pat].pendientes+=v;});});});
    return Object.values(pm).filter(p=>p.total>0).map(p=>({...p,avance:p.total>0?Math.round((p.terminados/p.total)*100):0})).sort((a,b)=>a.avance-b.avance).slice(0,10);
  },[data,filteredR]);

  const motivosData=React.useMemo(()=>{
    if(!rawRows.length)return[];
    const mm={};
    rawRows.forEach(row=>{
      const commerce=(getK(row,'Commerce')||'').trim();if(!commerce.toLowerCase().startsWith('i'))return;
      const region=(getK(row,'Region')||'Sin Región').trim();
      if(deferred.size>0&&!deferred.has(region))return;
      const estado=(getK(row,'Estado')||'').toLowerCase();if(!estado.includes('pendiente'))return;
      const po=(getK(row,'ParentOrder')||'').trim();if(!po)return;
      const motivo=((getK(row,'Motivo No Entrega')||getK(row,'MotivoNoEntrega')||getK(row,'Motivo')||'').trim())||'Sin motivo';
      if(!mm[motivo])mm[motivo]=new Set();
      mm[motivo].add(po);
    });
    const total=Object.values(mm).reduce((a,s)=>a+s.size,0);
    return Object.entries(mm).map(([tipo,poSet])=>({tipo,cantidad:poSet.size,pct:total>0?Math.round((poSet.size/total)*100):0})).sort((a,b)=>b.cantidad-a.cantidad);
  },[rawRows,deferred]);

  const sectData=React.useMemo(()=>{
    if(!data)return[];
    const empMap={};
    rawRows.forEach(row=>{const region=(getK(row,'Region')||'Sin Región').trim();const emp=(getK(row,'Empresa')||getK(row,'Transportista')||'').trim();if(!empMap[region])empMap[region]=new Set();if(emp)empMap[region].add(emp);});
    return filteredR.map(r=>{const rd=data.regions[r];if(!rd)return null;let terminados=0,enRuta=0;Object.keys(rd.estados).forEach(e=>{const v=rd.estados[e].size;const el=e.toLowerCase();if(el.includes('terminado'))terminados+=v;if(el.includes('en ruta')||el.includes('enruta'))enRuta+=v;});const total=rd.orders.size;return{region:r,patentes:Object.keys(rd.patentes).length,empresas:empMap[r]?empMap[r].size:0,terminados,enRuta,total,avance:total>0?Math.round((terminados/total)*100):0};}).filter(Boolean);
  },[data,filteredR,rawRows]);

  const sectPatData=React.useMemo(()=>{
    if(!data||!rawRows.length)return[];
    const result={};
    rawRows.forEach(row=>{
      const commerce=(getK(row,'Commerce')||'').trim();if(!commerce.toLowerCase().startsWith('i'))return;
      const region=(getK(row,'Region')||'Sin Región').trim();
      if(deferred.size>0&&!deferred.has(region))return;
      const patente=(getK(row,'Patente')||'').trim();if(!patente)return;
      const estado=(getK(row,'Estado')||'Sin Estado').trim();
      const gestion=(getK(row,'Gestión')||getK(row,'GESTIÓN')||'DIRECTO').trim().toUpperCase();
      const po=(getK(row,'ParentOrder')||'').trim();
      const key=`${region}||${patente}||${gestion}`;
      if(!result[key])result[key]={region,patente,gestion,orders:new Set(),terminados:new Set(),enRuta:new Set(),pendientes:new Set()};
      result[key].orders.add(po);
      const el=estado.toLowerCase();
      if(el.includes('terminado'))result[key].terminados.add(po);
      else if(el.includes('en ruta')||el.includes('enruta'))result[key].enRuta.add(po);
      else if(el.includes('pendiente'))result[key].pendientes.add(po);
    });
    return Object.values(result).map(r=>({region:r.region,patente:r.patente,gestion:r.gestion,total:r.orders.size,terminados:r.terminados.size,enRuta:r.enRuta.size,pendientes:r.pendientes.size,avance:r.orders.size>0?Math.round((r.terminados.size/r.orders.size)*100):0})).sort((a,b)=>a.region.localeCompare(b.region)||a.patente.localeCompare(b.patente));
  },[data,rawRows,deferred]);

  const excData=React.useMemo(()=>{
    if(!data||!data.incidenciasByPatente)return[];
    const rows=[];
    Object.entries(data.incidenciasByPatente).forEach(([pat,inc])=>{
      if(deferred.size>0&&!deferred.has(inc.region))return;
      const mm={};
      inc.eventos.forEach(ev=>{const k=ev.motivo||'Sin motivo';if(!mm[k])mm[k]={ordenes:0,fotos:[],isos:[]};mm[k].ordenes++;mm[k].fotos.push(...ev.fotos);if(ev.iso&&!mm[k].isos.includes(ev.iso))mm[k].isos.push(ev.iso);});
      Object.entries(mm).forEach(([motivo,md])=>{const m3=gMotivo3(motivo);const m2=gMotivo2(m3);rows.push({region:inc.region,empresa:inc.empresa,patente:pat,motivo,ordenes:md.ordenes,fotos:md.fotos,isos:md.isos,m2,m3});});
    });
    return rows.sort((a,b)=>b.ordenes-a.ordenes);
  },[data,deferred]);

  const exportPDF=async()=>{
    const el=dashRef.current;if(!el)return;
    setExporting(true);
    try{
      const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:1.5,useCORS:true,logging:false,windowWidth:1100,ignoreElements:e=>e.hasAttribute&&e.hasAttribute('data-html2canvas-ignore')});
      const jpdf=window.jspdf;if(!jpdf){setExporting(false);return;}
      const{jsPDF}=jpdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});

      const ratio=pdfW/canvas.width;let sliceY=0;let page=0;
      while(sliceY<canvas.height){if(page>0)pdf.addPage();const sliceH=Math.min(pdfH/ratio,canvas.height-sliceY);const sc=document.createElement('canvas');sc.width=canvas.width;sc.height=Math.ceil(sliceH);const ctx=sc.getContext('2d');ctx.drawImage(canvas,0,sliceY,canvas.width,Math.ceil(sliceH),0,0,canvas.width,Math.ceil(sliceH));pdf.addImage(sc.toDataURL('image/png'),'PNG',0,0,pdfW,sliceH*ratio);sliceY+=sliceH;page++;}
      const fecha=new Date().toLocaleDateString('es-CL').replace(/\//g,'-');
      pdf.save(`Dashboard_Rutas_${fecha}.pdf`);
    }catch(e){console.error(e);}
    finally{setExporting(false);}
  };

  const ST=t=><div style={{fontSize:9,fontWeight:900,textTransform:'uppercase',letterSpacing:'0.12em',color:DS.textFaint,marginBottom:12,paddingBottom:8,borderBottom:`1px solid ${DS.borderSoft}`}}>{t}</div>;
  const dashBadge=selRegions.size===0?'Global':selRegions.size===1?[...selRegions][0]:`${selRegions.size} regiones`;

  if(!data)return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:16,opacity:0.35}}><div style={{fontSize:60}}>📊</div><div style={{fontSize:16,fontWeight:700}}>Sin datos procesados</div></div>;

  return <div style={{position:'absolute',inset:0,overflow:'auto',padding:'12px 20px',background:DS.bg,fontFamily:DS.fontBase}}>
    {/* Sticky toolbar */}
    <div data-html2canvas-ignore style={{display:'flex',gap:8,alignItems:'center',marginBottom:14,position:'sticky',top:0,zIndex:20,padding:'6px 12px',borderRadius:8,border:`1px solid rgba(0,0,0,0.06)`,boxShadow:'0 4px 16px rgba(0,0,0,0.06)',backdropFilter:'blur(12px)',background:'rgba(250,250,249,0.92)'}}>
      <MRRegionDropdown allRegions={allRegions} selected={selRegions} onChange={setSelRegions}/>
      <div style={{flex:1}}/>
      <button onClick={exportPDF} disabled={exporting} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:6,background:'#18181B',color:'#fff',border:'1px solid rgba(0,0,0,0.06)',fontSize:10,fontWeight:700,cursor:exporting?'not-allowed':'pointer',opacity:exporting?0.6:1,fontFamily:DS.fontBase}}>
        <FileDn size={13}/>{exporting?'Generando...':'Descargar PDF'}

<script type="text/babel">
(function(){

function ChartTickV({x,y,payload,notes}){
  const note=notes&&notes[payload.value];
  return <g transform={`translate(${x},${y})`}>
    <text x={0} y={0} dy={note?2:8} textAnchor="end" fill="#636c76" fontSize={10} fontWeight={note?700:400} transform="rotate(-45)">{payload.value}</text>
    {note&&<text x={0} y={18} textAnchor="end" fill="#8b5cf6" fontSize={8} transform="rotate(-45)">{note.length>14?note.slice(0,14)+'…':note}</text>}
  </g>;
}
function ChartTickH({x,y,payload,notes}){
  const note=notes&&notes[payload.value];
  return <g>
    <text x={x-4} y={note?y-5:y} textAnchor="end" dominantBaseline="middle" fill="#636c76" fontSize={10} fontWeight={note?700:400}>{payload.value}</text>
    {note&&<text x={x-4} y={y+7} textAnchor="end" dominantBaseline="middle" fill="#8b5cf6" fontSize={8}>{note.length>24?note.slice(0,24)+'…':note}</text>}

}

window.GraficoChart = function GraficoChart({ data = [], notes = {}, onNoteChange }) {

  const visible = React.useMemo(
    () => data.filter(d => !hiddenKeys.has(d.patente)),

  const toggle = key => setHiddenKeys(prev => {
    const n = new Set(prev);
    n.has(key) ? n.delete(key) : n.add(key);
    return n;
  });

  const exportImg = async (mode = 'download') => {
    const el = chartRef.current; if (!el) return;
    const EXPORT_W = 1200;
    const saved = { pos: el.style.position, left: el.style.left, top: el.style.top, width: el.style.width };
    const restore = () => { el.style.position = saved.pos; el.style.left = saved.left; el.style.top = saved.top; el.style.width = saved.width; };
    try {
      el.style.position = 'fixed'; el.style.left = '0'; el.style.top = '0'; el.style.width = EXPORT_W + 'px';
      await new Promise(r => setTimeout(r, 200));
      const canvas = await html2canvas(el, { backgroundColor: '#fff', scale: 2, useCORS: true, logging: false, windowWidth: EXPORT_W });
      restore();
      if (mode === 'copy') {
        canvas.toBlob(blob => { if (blob) navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); });
      } else {
        const link = document.createElement('a'); link.download = 'grafico_rutas.png'; link.href = canvas.toDataURL('image/png'); link.click();
      }

      const parts = l.split(sep);

        <div style={{display:'flex',background:'rgba(0,0,0,0.05)',borderRadius:6,padding:3,gap:2}}>
